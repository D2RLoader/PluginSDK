# Config File Sample Plugin
#
# D2RLoader gives each plugin a config path based on its plugin id.
# This example is copied to d2rloader/config/config-file-sample.toml.

[config-file-sample]
enabled = true
message = "Hello from config-file-sample.toml"

# Shared plugins can list the settings that must match between players.
# Use exact paths from this embedded default file. Do not list client-only settings.
[d2rl]
match = ["config-file-sample.enabled"]
